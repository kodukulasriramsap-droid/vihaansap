<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SAP Training, Consulting, Sandbox Access and Career Guidance by Sri Vihaan Consulting." />
    
    <!-- Open Graph / SEO metadata -->
    <meta property="og:title" content="Sri Vihaan Consulting" />
    <meta property="og:description" content="SAP Training, Consulting, Sandbox Access and Career Guidance by Sri Vihaan Consulting." />
    <meta property="og:type" content="website" />
    <meta name="application-name" content="Sri Vihaan" />
    <meta name="apple-mobile-web-app-title" content="Sri Vihaan" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <title>Sri Vihaan Consulting</title>
  </head>
  <body>
    <div id="root">
      <style>
        .initial-loader-wrapper {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          min-height: 100vh;
          background-color: #f8fafc;
          font-family: system-ui, -apple-system, sans-serif;
        }
        .initial-loader-logo {
          max-width: 220px;
          height: auto;
          object-fit: contain;
          margin-bottom: 2rem;
          animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        .initial-loader-spinner {
          width: 2.5rem;
          height: 2.5rem;
          border: 4px solid #e2e8f0;
          border-top-color: #1763b6;
          border-radius: 50%;
          animation: spin 1s linear infinite;
        }
        .initial-loader-text {
          margin-top: 1rem;
          color: #64748b;
          font-size: 0.875rem;
          font-weight: 500;
          letter-spacing: 0.025em;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .7; } }
      </style>
      <div class="initial-loader-wrapper">
        <img src="/header-logo.png" alt="Sri Vihaan Logo" class="initial-loader-logo" />
        <div class="initial-loader-spinner"></div>
        <p class="initial-loader-text">Loading...</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
